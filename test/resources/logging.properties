# JUL config for unit tests; set the following VM arg in JUnit run config (IntelliJ)
# -Djava.util.logging.config.file="$MODULE_DIR$/test/resources/logging.properties"
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=ALL
# default level for all loggers:
.level=CONFIG
# special case for HtmlUnit's WebConsole, to print messages logged with JS console.debug
com.gargoylesoftware.htmlunit.WebConsole.level=FINE